apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    name: registry-isovalent-com
  name: registry-isovalent-com
  namespace: openshift-config
spec:
  body: '{"description":"c-green-test-1234_pull-secret","token_type":"access_token"}'
  headers:
    Authorization: Bearer {{ print .pull.access_token }}
    Content-Type: application/json
  method: POST
  result:
    jsonPath: $
  secrets:
    - name: pull
      secretRef:
        name: cilium-pull-secret
  url: https://registry.isovalent.com/access/api/v1/tokens
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    name: cilium-pull-secret
  name: cilium-pull-secret
  namespace: openshift-config
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: registry-isovalent-com
  refreshInterval: 720h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cilium-pull-secret
    template:
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "containers.isovalent.com": {
                "auth": "{{ printf "%s:%s" .username .access_token | b64enc }}"
              }
            }
          }
        access_token: '{{ print .access_token }}'
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          external-secrets.io/type: webhook
          pull-secret.openshift-config.syn.tools/include: ''
      type: kubernetes.io/dockerconfigjson
