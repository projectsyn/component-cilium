apiVersion: v1
data: {}
kind: Secret
metadata:
  annotations: {}
  labels:
    name: isovalent-registry-config
  name: isovalent-registry-config
  namespace: openshift-config
stringData:
  access_token: t-silent-test-1234/c-green-test-1234/isovalent/access_token
  pull_secret_template.yaml: '{"apiVersion":"v1","kind":"Secret","metadata":{"labels":{"external-secrets.io/type":"webhook"}},"stringData":{".dockerconfigjson":"{}"},"type":"kubernetes.io/dockerconfigjson"}'
type: Opaque
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
  labels:
    name: bootstrap-cilium-pull-secret
  name: bootstrap-cilium-pull-secret
  namespace: openshift-config
spec:
  activeDeadlineSeconds: 30
  backoffLimit: 1
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        name: bootstrap-cilium-pull-secret
    spec:
      containers:
        - args: []
          command:
            - bash
            - -c
            - |
              if ! kubectl -n "${NAMESPACE}" get secret "${PULL_SECRET}" &>/dev/null; then
                echo "Creating initial secret '${PULL_SECRET}'"
                yq '.metadata.name=strenv(PULL_SECRET) | .stringData.access_token=strenv(ACCESS_TOKEN)' \
                  /config/pull_secret_template.yaml \
                  | kubectl -n "${NAMESPACE}" apply --server-side -f-
              else
                echo "Secret '${PULL_SECRET}' already exists, nothing to do."
              fi
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: access_token
                  name: isovalent-registry-config
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PULL_SECRET
              value: cilium-pull-secret
          image: quay.io/appuio/oc:v4.22@sha256:2e867c0c31babcdc1300b568e35ec42d1121b252c52dc04505b70dce7ada3026
          imagePullPolicy: IfNotPresent
          name: pull-secret-bootstrap
          ports: []
          stdin: false
          tty: false
          volumeMounts:
            - mountPath: /config
              name: config
      imagePullSecrets: []
      initContainers: []
      restartPolicy: OnFailure
      serviceAccountName: cilium-pull-secret-bootstrapper
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          secret:
            items:
              - key: pull_secret_template.yaml
                mode: 384
                path: pull_secret_template.yaml
            secretName: isovalent-registry-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  labels:
    name: cilium-pull-secret-bootstrapper
  name: cilium-pull-secret-bootstrapper
  namespace: openshift-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations: {}
  labels:
    name: cilium-pull-secret-bootstrapper
  name: cilium-pull-secret-bootstrapper
  namespace: openshift-config
rules:
  - apiGroups:
      - ''
    resourceNames:
      - isovalent-registry-config
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resourceNames:
      - cilium-pull-secret
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations: {}
  labels:
    name: cilium-pull-secret-bootstrapper
  name: cilium-pull-secret-bootstrapper
  namespace: openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cilium-pull-secret-bootstrapper
subjects:
  - kind: ServiceAccount
    name: cilium-pull-secret-bootstrapper
    namespace: openshift-config
